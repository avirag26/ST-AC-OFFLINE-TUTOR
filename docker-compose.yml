services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: st-ac-offline-tutor
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
